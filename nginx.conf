events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Gzip compression for high-performance result publishing
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Main Web Interface
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # ALB Target Group Health Check Endpoint (Returns 200 OK)
        location /health {
            default_type application/json;
            return 200 '{"status":"UP","timestamp":"$time_iso8601","service":"ssc-result-app"}';
        }

        # Unhealthy Simulation Endpoint (for assignment screenshot testing)
        location /unhealthy {
            default_type application/json;
            return 500 '{"status":"DOWN","error":"Simulated Node Failure"}';
        }
    }
}
